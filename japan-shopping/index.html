<title>일본 쇼핑 비서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-width app shell (max 480px) with sticky header and fixed bottom tab bar; price tags borrow Japanese drugstore POP yellow. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#17203A; --muted:#5B6580; --line:#DFE3EC;
  --accent:#2445D6; --accent-soft:#E6EBFF; --tag:#FFD43B; --tag-ink:#3A2B00;
  --good:#1D8548; --good-soft:#E3F4EA; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#C9342A; --bad-soft:#FBE6E4;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Noto Sans JP",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#171C2D; --ink:#E7EAF4; --muted:#98A1BB; --line:#283049;
  --accent:#7D93FF; --accent-soft:#232C52; --tag:#FFD43B; --tag-ink:#2A1F00;
  --good:#4CC47F; --good-soft:#15301F; --warn:#E5AA4B; --warn-soft:#33270F; --bad:#FF6F62; --bad-soft:#3A1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2D; --ink:#E7EAF4; --muted:#98A1BB; --line:#283049;
  --accent:#7D93FF; --accent-soft:#232C52; --tag:#FFD43B; --tag-ink:#2A1F00;
  --good:#4CC47F; --good-soft:#15301F; --warn:#E5AA4B; --warn-soft:#33270F; --bad:#FF6F62; --bad-soft:#3A1916; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.chip-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.sample{font-size:12px;color:var(--warn);background:var(--warn-soft);padding-block:6px;text-align:center}
main{display:flex;flex-direction:column;gap:16px;padding-block:16px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.jp{font-family:var(--f-jp);font-size:12px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.notice{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13.5px}
.notice b{color:var(--accent)}
.rank{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:34px 44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.rank-row:first-child{border-top:0}
.rank-n{font-family:var(--f-display);font-size:22px;text-align:center;color:var(--muted)}
.rank-row:nth-child(-n+3) .rank-n{color:var(--accent)}
.rank-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.rank-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.thumb.ph{display:block}
.hero-img{width:96px;height:96px}
.online{display:flex;gap:12px;align-items:center;padding:12px 14px}
.credit{text-align:center;font-size:11px;color:var(--muted);padding:18px 0 4px}
.credit a{color:inherit}
.rank-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.line{border:1px solid var(--line);color:var(--muted)}
.tag{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-num);font-weight:600;padding:2px 8px;border-radius:4px;transform:rotate(-1.5deg)}
.price{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.back{border:0;background:transparent;padding:0;color:var(--accent);font-weight:500;align-self:flex-start}
.store{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.store:first-of-type{border-top:0}
.store.best{background:color-mix(in srgb,var(--tag) 12%,transparent)}
.report{display:flex;gap:6px}
.report button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:13px 16px;font-weight:700;width:100%}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--bg);width:34px;height:32px;font-size:17px}
.stepper span{min-width:32px;text-align:center;font-family:var(--f-num)}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li>div:first-child{min-width:0}
.group{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px dashed var(--line)}
.group:first-of-type{border-top:0}
.stop{font-family:var(--f-display);background:var(--ink);color:var(--surface);width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;flex:none}
.big{font-family:var(--f-num);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px}
.bar.over i{background:var(--bad)}
.bar.near i{background:var(--warn)}
.limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.limit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select,.sheet input,.sheet select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;width:100%;min-width:0}
.del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;font-family:var(--f-num);border-radius:999px;padding:0 5px;line-height:16px}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:13.5px;max-width:calc(100% - 32px)}
.photo{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:14px;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--accent)!important;font-weight:500;min-height:88px}
.photo img{max-height:220px;width:auto;object-fit:contain;border-radius:8px}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.rank-row,.cats button,.seg button{transition:background .15s,color .15s}}
</style>

}

function lowestOf(p){let best=null;for(const st of stores()){const b=priceAt(st,p);if(b!=null&&(!best||b<best.b))best={b,st};}return best;}
function stockPill(s){const cls={ok:'good',low:'warn',out:'bad'}[s.st];
  const meta=(s.mine?t('mine')+' · ':'')+ago(s.ago)+(s.n>1||!s.mine?' · '+t('people',{n:s.n||1}):'');
  return `<span class="pill ${cls}">${t(s.st)}</span><span class="small muted">${meta}</span>`;}

/* ---------- planner ---------- */
function computePlan(){
  const sts=stores();
  const items=S.list.map(l=>({p:P[l.id],q:l.q})).filter(x=>x.p);
  const opts=items.map(it=>sts.map((st,si)=>{const b=priceAt(st,it.p);const s=stockOf(st,it.p);return(b!=null&&s.st!=='out')?{si,b}:null;}).filter(Boolean));
  const ok=items.map((_,i)=>opts[i].length>0);
  const idx=items.map((_,i)=>i).filter(i=>ok[i]);
  function evalA(asg){
    const g={};
    idx.forEach(i=>{const si=asg[i];const o=opts[i].find(o=>o.si===si);(g[si]=g[si]||{si,lines:[],sub:0,tax:0});
      g[si].lines.push({p:items[i].p,q:items[i].q,b:o.b});g[si].sub+=o.b*items[i].q;g[si].tax+=Math.floor(o.b*rate(items[i].p))*items[i].q;});
    let total=0;const groups=Object.values(g).map(x=>{
      const st=sts[x.si];const cpn=st.cp&&x.sub>=st.cp.min?Math.floor(x.sub*st.cp.p/100):0;
      const taxA=Math.floor(x.tax*(1-(cpn?st.cp.p/100:0)));const elig=x.sub>=5000;
      const paid=x.sub-cpn+taxA;const net=paid-(elig?taxA:0);total+=net;
      return{...x,st,cpn,taxA,elig,paid,net};});
    return{total,groups:groups.sort((a,b)=>a.st.dist-b.st.dist)};
  }
  function improve(asg){
    let cur=evalA(asg).total;
    for(let it=0;it<40;it++){
      let best=null;
      for(const i of idx)for(const o of opts[i]){if(o.si===asg[i])continue;const a2=[...asg];a2[i]=o.si;const c=evalA(a2).total;if(c<cur-0.5&&(!best||c<best.c))best={a:a2,c};}
      const used=[...new Set(idx.map(i=>asg[i]))];
      for(const from of used)for(let to=0;to<sts.length;to++){if(to===from)continue;const a2=[...asg];let fine=true;
        for(const i of idx)if(asg[i]===from){if(opts[i].some(o=>o.si===to))a2[i]=to;else{fine=false;break;}}
        if(!fine)continue;const c=evalA(a2).total;if(c<cur-0.5&&(!best||c<best.c))best={a:a2,c};}
      if(!best)break;asg=best.a;cur=best.c;
    }
    return asg;
  }
  const cheap=items.map((_,i)=>ok[i]?opts[i].reduce((a,b)=>b.b<a.b?b:a).si:-1);
  const cheapEval=evalA(cheap);
  let single=null;
  sts.forEach((st,si)=>{if(idx.every(i=>opts[i].some(o=>o.si===si))){const a=items.map(()=>si);const e=evalA(a);if(!single||e.total<single.e.total)single={st,e,a};}});
  let best=improve(cheap);let bestE=evalA(best);
  if(single){const a=improve(single.a);const e=evalA(a);if(e.total<bestE.total){best=a;bestE=e;}}
  return{plan:bestE,cheapEval,single,missing:items.filter((_,i)=>!ok[i]).map(x=>x.p)};
}

function viewList(){
  if(!S.list.length)return `<h2>${t('listTitle')}</h2><div class="card empty">${t('listEmpty')}</div>`;
  const items=S.list.map(l=>`<div class="li"><div><div class="rank-name">${esc(pname(P[l.id]))}</div><div class="jp">${P[l.id].ja}</div></div>
    <div class="stepper"><button data-a="lq" data-v="${l.id}|-1" aria-label="-">−</button><span>${l.q}</span><button data-a="lq" data-v="${l.id}|1" aria-label="+">+</button></div></div>`).join('');
  const {plan,cheapEval,single,missing}=computePlan();
  const groups=plan.groups.map((g,i)=>{
    const need=5000-g.sub;
    return `<div class="group">
      <div class="between"><div class="row"><span class="stop">${i+1}</span><h3>${esc(sname(g.st))}</h3><span class="small muted num">${g.st.dist}${t('m')}</span></div>
        <span class="price">${yen(g.net)}</span></div>
      ${g.lines.map(l=>`<div class="between small"><span style="min-width:0">${esc(pname(l.p))} × ${l.q}</span><span class="num muted">${yen(withTax(l.b,l.p)*l.q)}</span></div>`).join('')}
      <div class="row">${g.elig?`<span class="pill good">${t('taxfreeOk')}</span><span class="pill line">${t('refund',{r:g.taxA.toLocaleString('ja-JP')})}</span>`:
        `<span class="pill warn">${t('taxfreeNo')}</span><span class="small muted">${t('needMore',{need:need.toLocaleString('ja-JP'),ref:Math.floor(5000*.1).toLocaleString('ja-JP')})}</span>`}
        ${g.cpn?`<span class="pill accent">${t('couponApplied',{c:g.cpn.toLocaleString('ja-JP')})}</span>`:''}</div>
    </div>`;}).join('');
  const alt=(label,total)=>`<div class="between small"><span class="muted" style="min-width:0">${label}</span><span class="num">${yen(total)}${total>plan.total?` <span class="pill good">${t('save',{s:Math.round(total-plan.total).toLocaleString('ja-JP')})}</span>`:''}</span></div>`;
  return `<h2>${t('listTitle')}</h2><div class="card">${items}</div>
   <div class="card">
    <div class="pad" style="display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)">
     <h2>${t('planTitle')}</h2><span class="small muted">${t('planDesc')}</span>
     <div class="between" style="margin-top:6px"><span class="small muted">${t('totalNet')} · ${t('stores',{n:plan.groups.length})}</span></div>
     <div class="row" style="align-items:baseline"><span class="big">${yen(plan.total)}</span><span class="muted">${homeAmt(plan.total)}</span></div>
    </div>
    ${groups}
    <div class="pad" style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)">
     ${alt(t('altCheap'),cheapEval.total)}
     ${single?alt(t('altOne',{s:sname(single.st)}),single.e.total):`<span class="small muted">${t('altNone')}</span>`}
     ${missing.length?`<span class="small" style="color:var(--bad)">${t('unavailable',{names:missing.map(pname).join(', ')})}</span>`:''}
    </div>
   </div>
   <button class="btn ghost" data-a="done">${t('done')}</button>`;
}

/* ---------- tracker ---------- */
function viewTrack(){
  const KR=S.home==='KR';let gen=0,alcMl=0,alcN=0,alcYen=0,tob=0,perf=0;
  S.purchases.forEach(x=>{if(x.type==='general')gen+=x.yen;else if(x.type==='alcohol'){alcMl+=x.vol||0;alcN++;alcYen+=x.yen;}else if(x.type==='tobacco')tob+=x.vol||0;else if(x.type==='perfume')perf+=x.vol||0;});
  const limit=KR?800:35000;const used=KR?gen/S.rates.usd:gen*S.rates.twd;
  const pct=Math.min(100,used/limit*100);const cls=used>limit?'over':used>limit*.8?'near':'';
  const fmt=v=>KR?'$'+Math.round(v).toLocaleString('en-US'):'NT$'+Math.round(v).toLocaleString('zh-TW');
  const usdKrw=S.rates.usd*S.rates.krw;
  let taxBox='';
  if(used>limit){
    if(KR){const tax=(used-limit)*usdKrw*.2;const red=Math.min(tax*.3,200000);
      const w=n=>Math.round(n/100)*100;
      taxBox=`<div class="card pad" style="display:flex;flex-direction:column;gap:8px">
        <span class="small muted">${t('taxEst')}</span>
        <div class="between"><span>${t('declare')} <span class="small muted">${t('declareNote')}</span></span><span class="price" style="color:var(--good)">${w(tax-red).toLocaleString('ko-KR')}원</span></div>
        <div class="between"><span>${t('penalty')} <span class="small muted">${t('penaltyNote')}</span></span><span class="price" style="color:var(--bad)">${w(tax*1.4).toLocaleString('ko-KR')}원</span></div>
        <span class="small muted">${t('disclaim')}</span></div>`;}
    else taxBox=`<div class="notice"><b>${t('over')} ${fmt(used-limit)}</b><span>${t('twOver')}</span></div>`;
  }
  const lim=(label,okv,txt,rule)=>`<div class="limit"><span class="small muted">${label}</span><span class="price" style="color:${okv?'var(--ink)':'var(--bad)'}">${txt}</span><span class="small muted">${rule}</span></div>`;
  const alcOk=KR?(alcN<=2&&alcMl<=2000&&alcYen/S.rates.usd<=400):alcMl<=1500;
  const limits=`<div class="limits">
    ${lim(t('alcohol'),alcOk,(alcN?alcN+'· ':'')+alcMl+'ml',KR?t('alcKR'):t('alcTW'))}
    ${lim(t('tobacco'),tob<=200,tob+t('sticks'),t('tobLim'))}
    ${KR?lim(t('perfume'),perf<=100,perf+'ml',t('perfKR')):''}</div>`;
  const hasEx=S.purchases.some(x=>x.ex);
  const list=S.purchases.length?S.purchases.map((x,i)=>`<div class="li"><div><div class="rank-name">${esc(typeof x.n==='object'?(x.n[S.lang]||x.n.ko):x.n)}</div>
     <div class="row small muted"><span>${t(x.type)}${x.vol?` · ${x.vol}${x.type==='tobacco'?t('sticks'):'ml'}`:''}</span>${x.ex?`<span class="pill warn">${t('example')}</span>`:''}</div></div>
     <div class="row"><span class="price">${yen(x.yen)}</span><button class="del" data-a="delp" data-v="${i}" aria-label="삭제">✕</button></div></div>`).join(''):`<div class="empty">${t('noPurch')}</div>`;
  return `<div><h2>${t('trackTitle')}</h2><span class="small muted">${KR?t('trackKR'):t('trackTW')}</span></div>
   <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
     <div class="between"><span class="small muted">${t('general')} ${t('used')}</span><span class="small muted">${used>limit?t('over'):t('left')} <b class="num">${fmt(Math.abs(limit-used))}</b></span></div>
     <div class="row" style="align-items:baseline"><span class="big" style="color:${used>limit?'var(--bad)':'var(--ink)'}">${fmt(used)}</span><span class="muted num">/ ${fmt(limit)}</span></div>
     <div class="bar ${cls}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
     <span class="small muted">${yen(gen)}</span>
   </div>
   ${taxBox}${limits}
   ${KR?`<p class="small muted" style="margin:0">${t('tipKR')}</p>`:''}
   <div class="card"><div class="pad between" style="border-bottom:1px solid var(--line)"><h3>${t('purchases')}</h3>${hasEx?`<button class="chip-btn" data-a="clearex">${t('clearEx')}</button>`:''}</div>${list}</div>
   <form class="card pad form" id="addForm">
     <h3 class="full">${t('addItem')}</h3>
     <label class="full">${t('name')}<input id="fName" required maxlength="40"></label>
     <label>${t('yen')}<input id="fYen" type="number" inputmode="numeric" min="1" required></label>
     <label>${t('type')}<select id="fType"><option value="general">${t('general')}</option><option value="alcohol">${t('alcohol')}</option><option value="tobacco">${t('tobacco')}</option><option value="perfume">${t('perfume')}</option></select></label>
     <label class="full" id="fVolWrap" hidden>${t('amount')}<input id="fVol" type="number" inputmode="numeric" min="1"></label>
     <button class="btn full" type="submit">${t('add')}</button>
   </form>`;
}

    <div class="between"><h2>${t('settings')}</h2><button class="chip-btn" data-a="closeSheet">${t('close')}</button></div>
    <div class="form">
      <label>${t('lang')}<select id="sLang"><option value="ko">한국어</option><option value="zh">繁體中文</option></select></label>
      <label>${t('home')}<select id="sHome"><option value="KR">${t('korea')}</option><option value="TW">${t('taiwan')}</option></select></label>
      <label class="full">${t('city')}<select id="sCity"><option value="tokyo">${t('tokyo')}</option><option value="osaka">${t('osaka')}</option></select></label>
      <span class="full small muted">${t('rates')}</span>
      <label>${t('rKRW')}<input id="sKRW" type="number" step="0.01" value="${S.rates.krw}"></label>

/* ---------- price-tag report ---------- */
let SAMPLE=null,SN=null,snapCtl=null;
(async()=>{try{if(!window.claude||!window.claude.use)return;const s=await window.claude.use('sample');if(!s)return;
  const lim=await s.limits().catch(()=>null);if(lim&&lim.images){SAMPLE=s;if(SN)renderSnap();}}catch(e){}})();
function openSnap(pid){SN={pid:pid||'',sid:stores()[0].sid,blob:null,url:null,busy:false,msg:'',err:false,price:'',stock:'ok',conf:null,sale:false};renderSnap();}
function closeSnap(){if(snapCtl)snapCtl.abort();if(SN&&SN.url)URL.revokeObjectURL(SN.url);SN=null;document.getElementById('sheet').hidden=true;render();}
async function shrink(file){try{const bmp=await createImageBitmap(file);const k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85));}catch(e){return file;}}
function snapDerived(){
  if(!SN)return;const p=P[SN.pid];const st=stores().find(s=>s.sid===SN.sid);const b=parseInt(SN.price,10);
  const incl=document.getElementById('nIncl'),warn=document.getElementById('nWarn'),btn=document.getElementById('nSubmit');
  if(incl)incl.textContent=p&&b>0?t('inclIs',{p:yen(withTax(b,p))}):'';
  const cur=p&&st?basePrice(st,p):null;
  if(warn){const off=cur&&b>0&&Math.abs(b-cur)/cur>.5;warn.hidden=!off;if(off)warn.textContent=t('warnDiff',{p:yen(cur)});}
  if(btn)btn.disabled=!(p&&b>0&&b<200000);
}
function renderSnap(){
  const sh=document.getElementById('sheet');
  const opts=stores().map(s=>`<option value="${s.sid}">${esc(sname(s))} · ${s.dist}${t('m')}</option>`).join('');
  const prods=`<option value="">${t('choose')}</option>`+PRODUCTS.map(p=>`<option value="${p.id}">${esc(pname(p))}</option>`).join('');
  sh.innerHTML=`<div class="sheet-in" role="dialog" aria-modal="true" aria-label="${t('snapTitle')}">
    <div class="between"><h2>${t('snapTitle')}</h2><button class="chip-btn" data-a="closeSnap">${t('close')}</button></div>
    <span class="small muted">${t('snapDesc')}</span>
    <div class="form">
      <label class="full">${t('store')}<select id="nStore">${opts}</select></label>
      <label class="full photo" for="nPhoto">${SN.url?`<img src="${SN.url}" alt="">`:''}<span>${SN.url?t('photoAgain'):t('photo')}</span>
        <input id="nPhoto" type="file" accept="image/*" capture="environment"></label>
      ${SAMPLE?(SN.busy?`<div class="full between"><span class="small">${t('reading')}</span><button type="button" class="chip-btn" data-a="stopRead">${t('stop')}</button></div>`:
        `<button type="button" class="btn ghost full" data-a="readTag" ${SN.blob?'':'disabled'}>${t('readTag')}</button>`):
        `<span class="full small muted">${t('noAuto')}</span>`}
      ${SN.msg?`<div class="full row small" style="color:${SN.err?'var(--bad)':'var(--ink)'}">${SN.conf?`<span class="pill ${SN.conf==='high'?'good':SN.conf==='medium'?'warn':'bad'}">${t('conf_'+SN.conf)}</span>`:''}${SN.sale?`<span class="pill bad">${t('sale')}</span>`:''}<span>${esc(SN.msg)}</span></div>`:''}
      <label class="full">${t('product')}<select id="nProd">${prods}</select></label>
      <label>${t('priceExcl')}<input id="nPrice" type="number" inputmode="numeric" min="1" value="${esc(SN.price)}"></label>
      <div style="display:flex;align-items:flex-end;padding-bottom:10px"><span class="price" id="nIncl"></span></div>
      <span class="full small" id="nWarn" style="color:var(--warn)" hidden></span>
      <div class="full" style="display:flex;flex-direction:column;gap:4px"><span class="small muted">${t('stockNow')}</span>
        <div class="seg" style="grid-template-columns:repeat(3,1fr)">${['ok','low','out'].map(k=>`<button type="button" data-a="nStock" data-v="${k}" aria-pressed="${SN.stock===k}">${t(k)}</button>`).join('')}</div></div>
      <button type="button" class="btn full" id="nSubmit" data-a="submitRep">${t('submitRep')}</button>
      <span class="full small muted">${shareNote()}</span>
    </div></div>`;
  sh.hidden=false;
  sh.querySelector('#nStore').value=SN.sid;sh.querySelector('#nProd').value=SN.pid;
  snapDerived();
}
async function readTag(){
  if(!SAMPLE||!SN||!SN.blob||SN.busy)return;
  SN.busy=true;SN.msg='';SN.err=false;SN.conf=null;renderSnap();
  snapCtl=new AbortController();const me=SN;
  const catalog=PRODUCTS.map(p=>p.id+' | '+p.ja).join('\n');
  const prompt=`The image is a photo of a price tag (shelf label or POP card) in a Japanese drugstore or discount store.
Find the matching product in the catalog below and read its price.

Catalog (id | Japanese product name):
${catalog}

Rules:
- If the tag shows both 税込 (tax included) and 税抜 / 本体価格 (before tax), read both. If it shows only one, use its label to decide which one it is.
- If the product is not in the catalog, product_id is null.
- If something cannot be read, set it to null. Never guess digits you cannot see.
- note: one short sentence in ${S.lang==='zh'?'Traditional Chinese':'Korean'} for a traveler, saying what you read.

Reply with only one JSON object:
{"product_id": string|null, "tag_name": string|null, "jan": string|null, "price_excl": number|null, "price_incl": number|null, "is_sale": boolean, "confidence": "high"|"medium"|"low", "note": string}`;
  try{
    const r=await SAMPLE.json(prompt,{images:[SN.blob],signal:snapCtl.signal});
    if(SN!==me)return;
    if(r&&typeof r==='object'){
      if(r.product_id&&P[r.product_id])SN.pid=r.product_id;
      const p=P[SN.pid];const ex=Number(r.price_excl),inc=Number(r.price_incl);
      let b=ex>0?Math.round(ex):(inc>0?Math.round(inc/(1+(p?rate(p):.1))):0);
      if(b>0)SN.price=String(b);
      SN.conf=['high','medium','low'].includes(r.confidence)?r.confidence:null;SN.sale=!!r.is_sale;
      SN.msg=String(r.note||'')+(r.tag_name?` (${r.tag_name})`:'');
    }
  }catch(e){
    if(SN!==me)return;
    const c=e&&e.code;
    if(c==='not_granted'||c==='images_unavailable'){SAMPLE=null;SN.msg=t('errDenied');}
    else if(c==='cancelled')SN.msg='';
    else SN.msg=c==='rate_limited'?t('errRate'):c==='invalid_json'?t('errRead'):t('errGeneric');
    SN.err=!!SN.msg;
  }
  SN.busy=false;renderSnap();
}
function submitRep(){
  if(!SN)return;const b=parseInt(SN.price,10);if(!P[SN.pid]||!(b>0))return;
  const k=SN.sid+'|'+SN.pid,now=Date.now();
  S.priceRep[k]={b,at:now,sale:SN.sale};S.reports[k]={st:SN.stock,at:now};S.points=(S.points||0)+10;
  const live=shareReport(k,{b,st:SN.stock});
  const pid=SN.pid;closeSnap();S.tab='compare';S.detail=pid;render();toast(live?t('sharedOk'):t('repDone'));
}

/* ---------- shared reports (db) ---------- */
// reports/<viewerId> = {items:{"<storeId>|<productId>":{b?,st?,at}}} — one document per traveler, everyone reads all.
const SHARED={price:{},stock:{},people:0};
const SHARE={state:'off',db:null,uid:null,mine:{},chain:Promise.resolve(),pending:0,deferred:false};
function shareNote(){
  return SHARE.state==='live'?t('shareLive',{n:Math.max(1,SHARED.people)}):SHARE.state==='loading'?t('shareLoading'):
    SHARE.state==='slow'?t('shareSlow'):SHARE.state==='ro'?t('shareRO'):t('shareOff');
}
function validEntry(v,now){
  if(!v||typeof v!=='object')return null;const at=Number(v.at);if(!(at>0&&at<now+120000&&at>now-30*864e5))return null;
  const ok=x=>x>0&&x<now+120000&&x>now-30*864e5;const out={at};
  const b=Number(v.b),bAt=Number(v.bAt||v.at);if(Number.isInteger(b)&&b>0&&b<200000&&ok(bAt)){out.b=b;out.bAt=bAt;}
  const stAt=Number(v.stAt||v.at);if(['ok','low','out'].includes(v.st)&&ok(stAt)){out.st=v.st;out.stAt=stAt;}
  return(out.b||out.st)?out:null;
}
function aggregate(docs){
  const now=Date.now(),price={},stock={},seen={};let people=0;
  for(const d of docs){
    const body=d.data&&d.data();const items=body&&body.items;if(!items||typeof items!=='object')continue;
    const isMine=d.id===SHARE.uid;let any=false;
    for(const k of Object.keys(items).slice(0,400)){
      if(!/^[a-z]+-[a-z]+\|[a-z]+$/.test(k))continue;const e=validEntry(items[k],now);if(!e)continue;any=true;
      if(e.b&&(!price[k]||e.bAt>price[k].at))price[k]={b:e.b,at:e.bAt,mine:isMine};
      if(e.st)(seen[k]=seen[k]||[]).push({st:e.st,at:e.stAt,mine:isMine});
    }
    if(any)people++;
  }
  for(const k in seen){const l=seen[k].sort((a,b)=>b.at-a.at);const top=l[0];
    const n=l.filter(x=>x.st===top.st&&top.at-x.at<12*36e5).length;stock[k]={st:top.st,at:top.at,mine:top.mine,n};}
  SHARED.price=price;SHARED.stock=stock;SHARED.people=people;
}
function safeRender(){
  const ae=document.activeElement;
  if(SN||!document.getElementById('sheet').hidden){SHARE.deferred=true;return;}
  if(ae&&ae.id==='q'){const r=document.getElementById('results');if(r)r.innerHTML=resultsHTML();const sl=document.getElementById('shareLine');if(sl)sl.textContent=shareNote();return;}
  if(ae&&ae.closest&&ae.closest('#addForm')){SHARE.deferred=true;return;}
  render();
}
function shareReport(k,entry){
  if(!SHARE.db||!SHARE.uid||SHARE.state==='ro'||SHARE.state==='off')return false;
  const now=Date.now(),next={};
  for(const [kk,v] of Object.entries(SHARE.mine))if(v&&v.at>now-14*864e5)next[kk]=v;
  const rec={...(next[k]||{}),at:now};
  if(entry.b){rec.b=entry.b;rec.bAt=now;}
  if(entry.st){rec.st=entry.st;rec.stAt=now;}
  next[k]=rec;
  const keys=Object.keys(next).sort((a,b)=>next[b].at-next[a].at).slice(0,300);
  SHARE.mine=Object.fromEntries(keys.map(x=>[x,next[x]]));
  const body={items:SHARE.mine,v:1};SHARE.pending++;
  SHARE.chain=SHARE.chain.then(()=>SHARE.db.doc('reports/'+SHARE.uid).set(body)).catch(e=>{
    if(e&&e.code==='invalid_argument'){SHARE.state='ro';}
    toast(t('shareFail'));
  }).finally(()=>{SHARE.pending--;});
  return SHARE.state==='live'||SHARE.state==='loading'||SHARE.state==='slow';
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    SHARE.db=db;SHARE.uid=uid;SHARE.state='loading';safeRender();
    const timer=setTimeout(()=>{if(SHARE.state==='loading'){SHARE.state='slow';safeRender();}},10000);
    db.collection('reports').onSnapshot(snap=>{
      const own=snap.docs.find(d=>d.id===uid);
      if(own&&!SHARE.pending){const it=own.data()&&own.data().items;if(it&&typeof it==='object')SHARE.mine={...it};}
      aggregate(snap.docs);
      if(!snap.metadata.fromCache){clearTimeout(timer);if(SHARE.state==='loading'||SHARE.state==='slow')SHARE.state='live';}
      safeRender();
    },err=>{clearTimeout(timer);SHARE.state=(err&&err.code==='revoked')?'off':'slow';safeRender();});
  }catch(e){}
})();

/* ---------- render + events ---------- */
/* Required credit for the Yahoo! JAPAN Web API (format A). Do not restyle. */
const CREDIT='<footer class="credit"><!-- Begin Yahoo! JAPAN Web Services Attribution Snippet --><a href="https://developer.yahoo.co.jp/sitemap/" target="_blank" rel="noopener">Webサービス by Yahoo! JAPAN</a><!-- End Yahoo! JAPAN Web Services Attribution Snippet --></footer>';
function render(){
  renderTop();renderTabs();
  const v=document.getElementById('view');
  v.innerHTML=(S.tab==='home'?viewHome():S.tab==='compare'?viewCompare():S.tab==='list'?viewList():viewTrack())+CREDIT;
  save();
}
let toastT;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200);}
const A={
 tab:v=>{S.tab=v;if(v!=='compare')S.detail=null;else S.detail=null;window.scrollTo(0,0);render();},
 rank:v=>{S.rank=v;render();},
 open:v=>{S.tab='compare';S.detail=v;S._dq=1;window.scrollTo(0,0);render();},
 back:()=>{S.detail=null;render();},
 cat:v=>{S.cat=v;render();},
 dq:v=>{S._dq=Math.max(1,(S._dq||1)+(+v));document.getElementById('dq').textContent=S._dq;},
 add:v=>{const q=S._dq||1;const l=S.list.find(x=>x.id===v);if(l)l.q+=q;else S.list.push({id:v,q});toast(t('added'));render();},
 lq:v=>{const[id,d]=v.split('|');const l=S.list.find(x=>x.id===id);if(!l)return;l.q+=(+d);if(l.q<=0)S.list=S.list.filter(x=>x.id!==id);render();},
 report:v=>{const[sid,pid,st]=v.split('|');const k=sid+'|'+pid;S.reports[k]={st,at:Date.now()};
   const live=shareReport(k,{st});toast(live?t('reportedShared'):t('reported'));render();},
 done:()=>{const{plan}=computePlan();plan.groups.forEach(g=>{const n=g.lines.map(l=>pname(l.p)).join(', ');S.purchases.push({n:sname(g.st)+' · '+n,yen:Math.round(g.net),type:'general'});});
   S.list=[];S.tab='track';toast(t('recorded'));window.scrollTo(0,0);render();},
 delp:v=>{S.purchases.splice(+v,1);render();},
 clearex:()=>{S.purchases=S.purchases.filter(x=>!x.ex);render();},
 settings:()=>openSettings(),
 snap:v=>openSnap(v),
 closeSnap:()=>closeSnap(),
 readTag:()=>readTag(),
 stopRead:()=>{if(snapCtl)snapCtl.abort();},
 nStock:v=>{if(SN){SN.stock=v;document.querySelectorAll('[data-a="nStock"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));}},
 submitRep:()=>submitRep(),
 closeSheet:()=>{document.getElementById('sheet').hidden=true;render();},
};
document.addEventListener('click',e=>{
  const sh=document.getElementById('sheet');if(e.target===sh){if(SN)closeSnap();else{sh.hidden=true;render();}return;}
  const el=e.target.closest('[data-a]');if(!el)return;A[el.dataset.a]?.(el.dataset.v,el);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;document.getElementById('results').innerHTML=resultsHTML();save();}
  const num=x=>{const n=parseFloat(x);return n>0?n:null;};
  if(id==='sKRW'&&num(e.target.value))S.rates.krw=num(e.target.value);
  if(id==='sTWD'&&num(e.target.value))S.rates.twd=num(e.target.value);
  if(id==='sUSD'&&num(e.target.value))S.rates.usd=num(e.target.value);
  if(id==='nPrice'&&SN){SN.price=e.target.value;snapDerived();}
  if(id.startsWith('s'))save();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='sLang'){S.lang=e.target.value;openSettings();renderTop();renderTabs();}
  if(id==='sHome'){S.home=e.target.value;}
  if(id==='sCity'){S.city=e.target.value;renderTop();}
  if(id==='nStore'&&SN){SN.sid=e.target.value;snapDerived();}
  if(id==='nProd'&&SN){SN.pid=e.target.value;snapDerived();}
  if(id==='nPhoto'&&SN&&e.target.files&&e.target.files[0]){const me=SN;shrink(e.target.files[0]).then(b=>{if(SN!==me)return;if(SN.url)URL.revokeObjectURL(SN.url);
    SN.blob=b;SN.url=URL.createObjectURL(b);SN.msg='';SN.conf=null;renderSnap();if(SAMPLE)readTag();});}
  if(id==='fType'){const w=document.getElementById('fVolWrap');w.hidden=e.target.value==='general';}
  save();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addForm')return;e.preventDefault();
  const n=document.getElementById('fName').value.trim(),y=parseInt(document.getElementById('fYen').value,10),ty=document.getElementById('fType').value,vol=parseInt(document.getElementById('fVol').value,10)||0;
  if(!n||!(y>0))return;S.purchases.push({n,yen:y,type:ty,vol:ty==='general'?0:vol});render();
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(SHARE.deferred&&!SN&&document.getElementById('sheet').hidden){
  const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest('#addForm'))){SHARE.deferred=false;render();}}},0);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const sh=document.getElementById('sheet');if(!sh.hidden){if(SN)closeSnap();else{sh.hidden=true;render();}}}});
render();
</script>
